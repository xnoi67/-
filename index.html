<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผนที่เฝ้าระวังภัย ประเทศไทย</title>
<link rel="preconnect" href="https://maps.googleapis.com">
<link rel="preconnect" href="https://maps.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#14212b;--mute:#5d6b76;--line:#d9e0e5;--rain:#1c78d6;--fire:#e8480c;--flood:#0b8f8a;--quake:#7b3fc4}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--panel:#18222a;--ink:#e8eef2;--mute:#97a6b1;--line:#2a3843}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;font-weight:700}
#stamp{font-size:12px;color:var(--mute)}
#tsu,#fbn{display:none;color:#fff;padding:8px 12px;font-size:14px;line-height:1.45}
#tsu{background:#b3141f}
#fbn{background:#c2570c;cursor:pointer}
#tsu a{color:#fff;font-weight:600}
main{flex:1;display:flex;min-height:0}
.mapwrap{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0}
#anim{position:absolute;left:10px;bottom:24px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;display:flex;gap:8px;align-items:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#anim button{padding:3px 10px}
aside{width:350px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px;font-size:14px}
aside h2{font-size:14px;margin:14px 0 6px}aside h2:first-child{margin-top:0}
.lay label{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.src{margin-left:auto;font-size:11px;color:var(--mute);text-align:right}
.form{display:grid;gap:6px}
select,input,button{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button{cursor:pointer;background:var(--ink);color:var(--panel);border:0;font-weight:600}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--rain);outline-offset:1px}
.tel a{display:inline-block;margin:2px 6px 2px 0;padding:4px 9px;border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font-size:13px}
.note{font-size:12px;color:var(--mute);line-height:1.5}
.fi{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;margin-bottom:6px;border:1px solid var(--line);border-left-width:5px;border-radius:8px;cursor:pointer}
.fi b{display:block}.fi small{color:var(--mute)}
.fi.l3{border-left-color:#b3141f}.fi.l2{border-left-color:#e8480c}.fi.l1{border-left-color:#c99700}
.badge{font-size:11px;color:#fff;border-radius:10px;padding:1px 8px;white-space:nowrap}
.l3 .badge{background:#b3141f}.l2 .badge{background:#e8480c}.l1 .badge{background:#c99700}
.alt{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400;font-size:13px}
.alt.on{border-color:#1a73e8;background:rgba(26,115,232,.12)}
#rOut h3{font-size:13px;margin:12px 0 4px}
#rOut .sum{font-size:14px;line-height:1.6;margin:6px 0}
#gate{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px}
#gate div{background:var(--panel);border-radius:12px;padding:18px;max-width:430px;width:100%;display:grid;gap:8px}
#gate p{margin:0;font-size:14px;line-height:1.5}
@media(max-width:760px){main{flex-direction:column}aside{width:100%;border-left:0;border-top:1px solid var(--line);height:42vh;flex:none}h1{font-size:15px}}
</style>
</head>
<body>
<header>
  <h1 data-t="title"></h1>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="stamp"></span>
    <button class="sec" id="lang" style="padding:3px 10px"></button>
  </div>
</header>
<div id="tsu" role="alert"></div>
<div id="fbn" role="alert"></div>
<main>
  <div class="mapwrap">
    <div id="map"></div>
    <div id="anim"><button id="play" aria-label="play/pause">⏸</button><span id="ftime"></span></div>
  </div>
  <aside>
    <h2 data-t="routeH"></h2>
    <div class="form">
      <input id="rFrom" data-p="rFrom" autocomplete="off">
      <input id="rTo" data-p="rTo" autocomplete="off">
      <select id="rMode"><option value="DRIVING" data-t="mDrive"></option><option value="WALKING" data-t="mWalk"></option><option value="TRANSIT" data-t="mTransit"></option></select>
      <div style="display:flex;gap:6px"><button id="rGo" style="flex:1" data-t="rGo"></button><button class="sec" id="rClear" data-t="rClear"></button></div>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="l-traffic"><span data-t="traffic"></span><span class="src">Google</span></label>
    </div>
    <div id="rOut"></div>

    <h2 data-t="floodH"></h2>
    <div id="fl"><p class="note" data-t="checking"></p></div>
    <div class="form" style="margin-top:6px">
      <button class="sec" id="notif" data-t="notifBtn"></button>
      <a class="note" href="https://sites.research.google/floods" target="_blank" rel="noopener noreferrer" data-t="hub"></a>
    </div>

    <h2 data-t="layers"></h2>
    <div class="lay">
      <label><input type="checkbox" id="l-flood" checked><span class="dot" style="background:var(--flood)"></span><span data-t="flood"></span><span class="src">Open-Meteo</span></label>
      <label><input type="checkbox" id="l-rain" checked><span class="dot" style="background:var(--rain)"></span><span data-t="rain"></span><span class="src">Open-Meteo</span></label>
      <label><input type="checkbox" id="l-radar" checked><span class="dot" style="background:var(--rain)"></span><span data-t="radar"></span><span class="src">RainViewer</span></label>
      <label><input type="checkbox" id="l-sat"><span class="dot" style="background:#9aa"></span><span data-t="sat"></span><span class="src">RainViewer</span></label>
      <label><input type="checkbox" id="l-fire" checked><span class="dot" style="background:var(--fire)"></span><span data-t="fire"></span><span class="src">NASA GIBS</span></label>
      <label><input type="checkbox" id="l-quake" checked><span class="dot" style="background:var(--quake)"></span><span data-t="quake"></span><span class="src">USGS</span></label>
    </div>
    <div class="form" style="margin-top:6px">
      <button id="locate" data-t="locate"></button>
      <p class="note" style="margin:0" data-t="tapHint"></p>
      <input id="firmsKey" data-p="key" autocomplete="off" maxlength="64">
      <button class="sec" id="saveKey" data-t="keyBtn"></button>
    </div>
    <div class="note" id="st" style="margin-top:6px"></div>

    <h2 data-t="emerg"></h2>
    <div class="tel">
      <a href="tel:191" data-t="t191"></a><a href="tel:199" data-t="t199"></a><a href="tel:1669" data-t="t1669"></a>
      <a href="tel:1784" data-t="t1784"></a><a href="tel:1129" data-t="t1129"></a><a href="tel:1130" data-t="t1130"></a>
    </div>
    <h2 data-t="official"></h2>
    <p class="note"><a href="https://www.ndwc.go.th" target="_blank" rel="noopener noreferrer">NDWC</a> · <a href="https://www.tmd.go.th" target="_blank" rel="noopener noreferrer">TMD</a> · <a href="https://www.tsunami.gov" target="_blank" rel="noopener noreferrer">NOAA Tsunami</a> · <a href="https://disaster.gistda.or.th" target="_blank" rel="noopener noreferrer">GISTDA</a> · <a href="https://www.pea.co.th" target="_blank" rel="noopener noreferrer">PEA</a> · <a href="https://www.mea.or.th" target="_blank" rel="noopener noreferrer">MEA</a></p>
    <p class="note" data-t="limit"></p>
  </aside>
</main>

<div id="gate"><div>
  <b>Google Maps API key</b>
  <p id="gateMsg"></p>
  <input id="gkey" placeholder="AIza..." autocomplete="off">
  <button id="gsave"></button>
</div></div>

// ----- ชั้นไทล์ (ซูมเกินความละเอียดต้นทาง จะขยายไทล์เดิมแทนการโหลดใหม่) -----
class TL{
  constructor(fn,maxZ,op){this.fn=fn;this.maxZ=maxZ;this.op=op;this.divs=new Set();this.vis=true;this.tileSize=new google.maps.Size(256,256)}
  getTile(c,z,doc){
    const d=doc.createElement("div");d.style.cssText="width:256px;height:256px;position:relative;overflow:hidden;pointer-events:none";
    const n=1<<z;if(c.y<0||c.y>=n)return d;
    const x=((c.x%n)+n)%n,img=doc.createElement("img");img.draggable=false;img.decoding="async";
    if(z>this.maxZ){const k=z-this.maxZ;if(k>4)return d;const s=1<<k;
      img.src=this.fn(this.maxZ,x>>k,c.y>>k);
      img.style.cssText=`position:absolute;width:${256*s}px;height:${256*s}px;left:${-(x%s)*256}px;top:${-(c.y%s)*256}px`;
    }else{img.src=this.fn(z,x,c.y);img.style.cssText="width:256px;height:256px"}
    d.appendChild(img);d.style.opacity=this.vis?this.op:0;this.divs.add(d);return d}
  releaseTile(d){this.divs.delete(d)}
  setVis(v){this.vis=v;this.divs.forEach(d=>d.style.opacity=v?this.op:0)}
}
const on={radar:true,sat:false,fire:true,quake:true,rain:true,flood:true};
const OV={radar:[],sat:[],fire:[]},MK={quake:[],rain:[],flood:[]};
const addOv=l=>map.overlayMapTypes.push(l);
const rmOv=l=>{for(let i=0;i<map.overlayMapTypes.getLength();i++)if(map.overlayMapTypes.getAt(i)===l){map.overlayMapTypes.removeAt(i);break}};
function setOv(k,frames){OV[k].forEach(rmOv);OV[k]=frames;if(on[k])frames.forEach(addOv)}
function setMk(k,arr){MK[k].forEach(m=>m.setMap(null));MK[k]=arr;arr.forEach(m=>m.setMap(on[k]?map:null))}
Object.keys(on).forEach(k=>{const c=$("l-"+k);c.checked=on[k];c.onchange=e=>{on[k]=e.target.checked;
  if(OV[k])OV[k].forEach(l=>on[k]?addOv(l):rmOv(l));
  if(MK[k])MK[k].forEach(m=>m.setMap(on[k]?map:null))}});

setOv("fire",[new TL((z,x,y)=>`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_Thermal_Anomalies_375m_All/default/default/GoogleMapsCompatible_Level9/${z}/${y}/${x}.png`,8,.95)]);

const COL={rain:"#1c78d6",quake:"#7b3fc4",flood:"#0b8f8a"};
function dot(ll,color,r,html){
  const m=new google.maps.Marker({position:ll,icon:{path:google.maps.SymbolPath.CIRCLE,scale:r,fillColor:color,fillOpacity:.55,strokeColor:color,strokeWeight:2},optimized:true});
  m.addListener("click",()=>{iw.setContent(html);iw.open({map,anchor:m})});return m}

// ----- เรดาร์/ดาวเทียม เคลื่อนไหว -----
let playing=true,step=0,TM={radar:[],sat:[]};
let busy=false;
map.addListener("zoom_changed",()=>busy=true);map.addListener("dragstart",()=>busy=true);map.addListener("idle",()=>busy=false);
function tick(){
  if(busy||document.hidden)return;   // หยุดเล่นอนิเมชันตอนซูม/ลากแผนที่ เพื่อไม่ให้กระตุก
  let lab="";
  for(const k of ["radar","sat"]){const fr=OV[k];if(!fr.length||!on[k])continue;
    const n=fr.length,i=playing?step%n:n-1;fr.forEach((l,j)=>l.setVis(j===i));
    if(!lab&&TM[k][i])lab=new Date(TM[k][i]*1000).toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit"})}
  $("ftime").textContent=lab;if(playing)step++}
setInterval(tick,1000);
$("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"⏸":"▶"};
async function loadSat(){
  try{
    const j=await (await fetch("https://api.rainviewer.com/public/weather-maps.json")).json();
    const rad=[...j.radar.past.slice(-5),...(j.radar.nowcast||[]).slice(0,1)];
    const sig=rad.map(f=>f.path).join()+"|"+((j.satellite&&j.satellite.infrared||[]).slice(-1).map(f=>f.path).join());
    if(sig===loadSat.sig){note("rv","RainViewer ✓");return}   // ข้อมูลเดิม ไม่ต้องโหลดไทล์ใหม่
    loadSat.sig=sig;
    TM.radar=rad.map(f=>f.time);
    setOv("radar",rad.map(f=>{const l=new TL((z,x,y)=>`${j.host}${f.path}/256/${z}/${x}/${y}/2/1_1.png`,6,.7);l.setVis(false);return l}));
    const ir=(j.satellite&&j.satellite.infrared||[]).slice(-5);
    TM.sat=ir.map(f=>f.time);
    setOv("sat",ir.map(f=>{const l=new TL((z,x,y)=>`${j.host}${f.path}/256/${z}/${x}/${y}/0/0_0.png`,6,.5);l.setVis(false);return l}));
    note("rv","RainViewer ✓");
  }catch(e){note("rv","RainViewer ✗")}
}

// ----- ฝน 77 จังหวัด -----
const LA=C.map(c=>c[2]).join(","),LO=C.map(c=>c[3]).join(",");
async function loadRain(){
  try{
    const r=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LA}&longitude=${LO}&hourly=precipitation,precipitation_probability&forecast_hours=3&timezone=Asia%2FBangkok`)).json();
    const arr=[];
    (Array.isArray(r)?r:[r]).forEach((d,i)=>{
      const mm=d.hourly.precipitation.reduce((a,b)=>a+(b||0),0),p=Math.max(...d.hourly.precipitation_probability.map(x=>x||0));
      if(mm<.5&&!(p>=70&&mm>=.2))return;
      arr.push(dot({lat:C[i][2],lng:C[i][3]},COL.rain,4+Math.min(mm,5),`<b>${esc(nm(C[i]))}</b><br>${t("rainPop")}: ${mm.toFixed(1)} ${t("mm")}<br>${t("prob")} ${p}%`))});
    setMk("rain",arr);note("rain","Open-Meteo ✓");
  }catch(e){note("rain","Open-Meteo ✗")}
}

// ----- แจ้งเตือนน้ำท่วม (รูปแบบเดียวกับ Google: ระดับ + พื้นที่ + คำแนะนำ) -----
const LV={3:"#b3141f",2:"#e8480c",1:"#c99700"};
let floods=[];
function showFlood(f){
  map.panTo({lat:f.c[2],lng:f.c[3]});map.setZoom(Math.max(map.getZoom(),9));
  iw.setPosition({lat:f.c[2],lng:f.c[3]});
  iw.setContent(`<div style="max-width:240px;font-family:inherit"><b style="color:${LV[f.lv]}">⚠ ${t("flood")} · ${t("l"+f.lv)}</b><br><b>${esc(nm(f.c))}</b><br>${t("rise")} ≈ ${f.ratio.toFixed(1)}× ${t("within")}<br><small>${t("adv")}</small><br><a href="https://sites.research.google/floods" target="_blank" rel="noopener noreferrer">Google Flood Hub ↗</a></div>`);
  iw.open(map);
}
function renderFlood(){
  const box=$("fl"),ban=$("fbn");
  if(!floods.length){box.innerHTML=`<p class="note">${t("noFlood")}</p>`;ban.style.display="none";return}
  box.innerHTML="";
  floods.forEach(f=>{const d=document.createElement("div");d.className="fi l"+f.lv;d.tabIndex=0;
    d.innerHTML=`<div style="flex:1"><b>${esc(nm(f.c))}</b><small>${t("rise")} ≈ ${f.ratio.toFixed(1)}×</small></div><span class="badge">${t("l"+f.lv)}</span>`;
    d.onclick=()=>showFlood(f);d.onkeydown=e=>{if(e.key==="Enter")showFlood(f)};box.appendChild(d)});
  const hi=floods.filter(f=>f.lv>=2);
  if(hi.length){ban.style.display="block";ban.textContent=t("floodBanner")+hi.length+" "+t("prov");ban.onclick=()=>showFlood(hi[0])}else ban.style.display="none";
}
function pushNotify(){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  let seen={};try{seen=JSON.parse(localStorage.getItem("fseen")||"{}")}catch(e){}
  const day=new Date().toDateString();
  floods.filter(f=>f.lv>=2).forEach(f=>{const id=f.c[1]+f.lv;if(seen[id]===day)return;seen[id]=day;
    try{new Notification(t("floodBanner")+nm(f.c)+" ("+t("l"+f.lv)+")",{body:t("rise")+" ≈ "+f.ratio.toFixed(1)+"×"})}catch(e){}});
  try{localStorage.setItem("fseen",JSON.stringify(seen))}catch(e){}
}
$("notif").onclick=async()=>{
  if(!("Notification" in window))return;
  const p=await Notification.requestPermission();
  if(p==="granted"){$("notif").textContent=t("notifOn");pushNotify()}};
async function loadFlood(){
  try{
    const r=await (await fetch(`https://flood-api.open-meteo.com/v1/flood?latitude=${LA}&longitude=${LO}&daily=river_discharge&past_days=7&forecast_days=5`)).json();
    const arr=[];floods=[];
    (Array.isArray(r)?r:[r]).forEach((d,i)=>{
      const v=(d.daily&&d.daily.river_discharge||[]).filter(x=>x!=null);if(v.length<8)return;
      const base=v.slice(0,7).reduce((a,b)=>a+b,0)/7,peak=Math.max(...v.slice(7)),ratio=base>0?peak/base:0;
      if(base<1||ratio<1.5)return;
      const lv=ratio>=3?3:ratio>=2?2:1,f={c:C[i],ratio,lv};floods.push(f);
      const m=new google.maps.Marker({position:{lat:C[i][2],lng:C[i][3]},zIndex:10+lv,optimized:true,
        icon:{path:google.maps.SymbolPath.CIRCLE,scale:6+lv*2,fillColor:LV[lv],fillOpacity:.65,strokeColor:LV[lv],strokeWeight:1.5},
        label:{text:"!",color:"#fff",fontWeight:"700",fontSize:"11px"}});
      m.addListener("click",()=>showFlood(f));arr.push(m)});
    floods.sort((a,b)=>b.lv-a.lv||b.ratio-a.ratio);
    setMk("flood",arr);renderFlood();pushNotify();
  }catch(e){$("fl").innerHTML=`<p class="note">${t("fail")}</p>`}
}

// ----- แผ่นดินไหว/สึนามิ (เฉพาะแถบอันดามัน/อ่าวไทย) -----
async function loadQuake(){
  try{
    const r=await (await fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson")).json();
    const arr=[],al=[];
    r.features.forEach(f=>{
      const [lo,la]=f.geometry.coordinates,p=f.properties,m=p.mag||0,ts=p.tsunami===1;
      if(la<-2||la>25||lo<90||lo>112)return;
      const big=(ts&&m>=6.5)||m>=7;if(big)al.push({p,m});
      arr.push(dot({lat:la,lng:lo},big?"#b3141f":COL.quake,2+m*1.1,`<b>${t("mag")} ${m}</b> ${esc(p.place)}<br>${new Date(p.time).toLocaleString(loc())}${ts?"<br>🌊 tsunami flag":""}`))});
    setMk("quake",arr);
    const b=$("tsu");
    if(al.length){b.style.display="block";
      b.innerHTML=`<b>${t("tsuT")}</b><br>`+al.slice(0,3).map(a=>`${t("mag")} ${a.m} — ${esc(a.p.place)} (${new Date(a.p.time).toLocaleTimeString(loc())})`).join("<br>")+`<br>${t("tsuNote")} <a href="https://www.ndwc.go.th" target="_blank" rel="noopener noreferrer">NDWC</a> · <a href="https://www.tsunami.gov" target="_blank" rel="noopener noreferrer">tsunami.gov</a>`;
    }else b.style.display="none";
    note("q",al.length?"⚠ "+al.length:t("tsuOK"));
  }catch(e){note("q","USGS ✗")}
}

// ----- ตรวจที่จุดที่แตะ (ในประเทศไทย) -----
async function queryPoint(ll){
  if(!inTH(ll.lat,ll.lng)){iw.setPosition(ll);iw.setContent(t("outTH"));iw.open(map);return}
  iw.setPosition(ll);iw.setContent(t("checking"));iw.open(map);
  let fk="";try{fk=localStorage.getItem("firmsKey")||""}catch(e){}
  const wxP=fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ll.lat}&longitude=${ll.lng}&current=precipitation&hourly=precipitation,precipitation_probability&forecast_hours=3&timezone=auto`).then(r=>r.json());
  const nmP=fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${ll.lat}&longitude=${ll.lng}&localityLanguage=${lang}`).then(r=>r.json());
  const fireP=(fk&&on.fire)?fetch(`https://firms.modaps.eosdis.nasa.gov/api/area/csv/${encodeURIComponent(fk)}/VIIRS_SNPP_NRT/${ll.lng-.25},${ll.lat-.25},${ll.lng+.25},${ll.lat+.25}/1`).then(r=>r.text()):Promise.reject();
  const [w,n,f]=await Promise.allSettled([wxP,nmP,fireP]);
  let h="";
  if(n.status==="fulfilled"){const x=n.value;h+=`<b>${esc([x.locality||x.city,x.principalSubdivision].filter(Boolean).join(", ")||ll.lat.toFixed(3)+", "+ll.lng.toFixed(3))}</b><br>`}
  if(w.status==="fulfilled"){const r=w.value,now=r.current.precipitation||0,mm=r.hourly.precipitation.reduce((a,b)=>a+(b||0),0),p=Math.max(...r.hourly.precipitation_probability.map(x=>x||0));
    h+=(now>0?`<b style="color:#1c78d6">${t("nowRain")}</b> (${now.toFixed(1)} ${t("mm")}/h)`:t("noRain"))+`<br>${t("next3")}: ${mm.toFixed(1)} ${t("mm")} · ${t("prob")} ${p}%`}else h+=t("fail");
  if(f.status==="fulfilled"){const ln=f.value.trim().split("\n");h+=ln[0].startsWith("latitude")?`<br>🔥 ${t("fireN")} <b>${ln.length-1}</b>`:`<br>🔥 ✗`}
  else if(!fk&&on.fire)h+=`<br><small>🔥 ${t("fireKey")}</small>`;
  iw.setContent(`<div style="font-family:inherit;color:#14212b">${h}<br><a href="#" onclick="setDest(${ll.lat},${ll.lng});return false" style="display:inline-block;margin-top:6px;color:#1a73e8;font-weight:600">${t("goHere")}</a></div>`);
}
map.addListener("click",e=>queryPoint({lat:e.latLng.lat(),lng:e.latLng.lng()}));
$("locate").onclick=()=>{
  if(!navigator.geolocation){alert(t("nogeo"));return}
  navigator.geolocation.getCurrentPosition(p=>{const ll={lat:p.coords.latitude,lng:p.coords.longitude};
    if(!inTH(ll.lat,ll.lng)){alert(t("outTH"));return}
    map.panTo(ll);map.setZoom(11);queryPoint(ll)},()=>alert(t("nogeo")),{enableHighAccuracy:true,timeout:15000});
};

try{if("Notification" in window&&Notification.permission==="granted")$("notif").textContent=t("notifOn")}catch(e){}

// ทุก 1 นาที: เรดาร์/ดาวเทียม/แผ่นดินไหว  ส่วน Open-Meteo (ฝน 20 นาที, น้ำท่วม 60 นาที) ข้อมูลต้นทางอัปเดตช้ากว่านั้นและมีโควตาจำกัด
// ===== เส้นทาง + ตรวจจราจร/ฝน/พายุ/น้ำท่วมระหว่างทาง =====
const traffic=new google.maps.TrafficLayer();
$("l-traffic").onchange=e=>traffic.setMap(e.target.checked?map:null);
const RT={lines:[],marks:[],routes:[],sel:0,o:null,d:null,mode:"DRIVING"};
const hav=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 12742000*Math.asin(Math.sqrt(h))};
const nearProv=p=>{let b=C[0],bd=1e12;C.forEach(c=>{const d=hav(p,{lat:c[2],lng:c[3]});if(d<bd){bd=d;b=c}});return b};
const fmt=s=>{s=Math.round(s/60);const h=Math.floor(s/60),m=s%60;return (h?h+" "+t("hr")+" ":"")+m+" "+t("min")};
const hhmm=d=>d.toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit"});
function parseCoord(s){
  const N="(-?\\d+(?:\\.\\d+)?)";
  const m=s.match(new RegExp("!3d"+N+"!4d"+N))||s.match(new RegExp("[?&](?:q|ll|query|destination|daddr)="+N+"(?:,|%2C)\\s*"+N,"i"))||s.match(new RegExp("@"+N+","+N))||s.match(new RegExp("^\\(?\\s*"+N+"\\s*[, ]\\s*"+N+"\\s*\\)?$"));
  if(m){const a=+m[1],b=+m[2];if(Math.abs(a)<=90&&Math.abs(b)<=180)return{lat:a,lng:b}}
  return null}
async function geocode(q){
  try{const r=await new google.maps.Geocoder().geocode({address:q,region:"TH",componentRestrictions:{country:"TH"}});
    if(r.results&&r.results[0]){const g=r.results[0];return{ll:{lat:g.geometry.location.lat(),lng:g.geometry.location.lng()},label:g.formatted_address}}}catch(e){}
  try{const r=await (await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=th&accept-language="+lang+"&q="+encodeURIComponent(q))).json();
    if(r[0])return{ll:{lat:+r[0].lat,lng:+r[0].lon},label:r[0].display_name}}catch(e){}
  throw new Error(t("rNoPlace")+": "+q)}
async function resolveLoc(s){
  s=s.trim();
  if(/goo\.gl|maps\.app/i.test(s))throw new Error(t("rShort"));
  const c=parseCoord(s);if(c)return{ll:c,label:c.lat.toFixed(5)+", "+c.lng.toFixed(5)};
  const pm=s.match(/\/maps\/place\/([^/@?]+)/);
  return geocode(pm?decodeURIComponent(pm[1].replace(/\+/g," ")):s)}
const here=()=>new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error(t("nogeo")));
  navigator.geolocation.getCurrentPosition(p=>ok({ll:{lat:p.coords.latitude,lng:p.coords.longitude},label:t("rHere")}),()=>no(new Error(t("nogeo"))),{enableHighAccuracy:true,timeout:15000})});
async function getRoutes(o,d,mode){
  const lib=await google.maps.importLibrary("routes");
  try{
    const req={origin:o,destination:d,travelMode:mode,provideRouteAlternatives:true,region:"th"};
    if(mode==="DRIVING")req.drivingOptions={departureTime:new Date(),trafficModel:google.maps.TrafficModel.BEST_GUESS};
    const res=await new lib.DirectionsService().route(req);
    return res.routes.slice(0,3).map(r=>{const l=r.legs[0];return{name:r.summary,path:r.overview_path.map(p=>({lat:p.lat(),lng:p.lng()})),dist:l.distance.value,dur:l.duration.value,durT:l.duration_in_traffic?l.duration_in_traffic.value:null}});
  }catch(e1){
    try{
      const req={origin:o,destination:d,travelMode:mode,fields:["path","distanceMeters","durationMillis","staticDurationMillis","description"]};
      if(mode==="DRIVING"){req.routingPreference="TRAFFIC_AWARE";req.computeAlternativeRoutes=true}
      const {routes}=await lib.Route.computeRoutes(req);
      return routes.slice(0,3).map(r=>({name:r.description||"",path:r.path.map(p=>({lat:p.lat,lng:p.lng})),dist:r.distanceMeters,dur:(r.staticDurationMillis||r.durationMillis)/1000,durT:mode==="DRIVING"?r.durationMillis/1000:null}));
    }catch(e2){throw new Error(t("rFail"))}}}
function wxLevel(s){
  let lv=0;const tx=[];
  if([95,96,99].includes(s.code)){lv=3;tx.push(t("wStorm"))}
  if(s.mm>=7.5){lv=3;tx.push(t("wHeavy")+" "+s.mm.toFixed(1)+" "+t("mm")+"/h")}
  else if(s.mm>=2.5){lv=Math.max(lv,2);tx.push(t("wMod")+" "+s.mm.toFixed(1)+" "+t("mm")+"/h")}
  else if(s.mm>=.5||(s.p>=70&&s.mm>=.2)){lv=Math.max(lv,1);tx.push(t("wLight")+" "+s.mm.toFixed(1)+" "+t("mm")+"/h ("+s.p+"%)")}
  if(s.gust>=60){lv=3;tx.push(t("wGust")+" "+Math.round(s.gust)+" km/h")}
  else if(s.gust>=45){lv=Math.max(lv,2);tx.push(t("wGust")+" "+Math.round(s.gust)+" km/h")}
  s.lv=lv;s.tx=tx}
async function analyze(r){
  const out=$("rOut"),secs=r.durT||r.dur,now=Date.now(),path=r.path;
  // จุดตัวอย่างทุก ~15 กม.
  const cum=[0];for(let i=1;i<path.length;i++)cum.push(cum[i-1]+hav(path[i-1],path[i]));
  const total=cum[cum.length-1]||1,n=Math.min(20,Math.max(2,Math.ceil(total/15000)+1)),S=[];let j=0;
  for(let i=0;i<n;i++){const tg=total*i/(n-1);while(j<cum.length-2&&cum[j+1]<tg)j++;
    const seg=(cum[j+1]-cum[j])||1,f=Math.min(1,Math.max(0,(tg-cum[j])/seg)),a=path[j],b=path[j+1]||a;
    S.push({lat:a.lat+(b.lat-a.lat)*f,lng:a.lng+(b.lng-a.lng)*f,km:tg/1000,frac:i/(n-1)})}
  let wxOK=true;
  try{
    const la=S.map(s=>s.lat.toFixed(4)).join(","),lo=S.map(s=>s.lng.toFixed(4)).join(",");
    const w=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&hourly=precipitation,precipitation_probability,weather_code,wind_gusts_10m&forecast_days=2&timezone=Asia%2FBangkok`)).json();
    const ws=Array.isArray(w)?w:[w];
    S.forEach((s,i)=>{s.eta=new Date(now+s.frac*secs*1000);
      const key=new Date(s.eta.getTime()+7*3600e3).toISOString().slice(0,13)+":00",h=ws[i].hourly,k=h.time.indexOf(key);
      if(k<0){s.mm=0;s.p=0;s.code=0;s.gust=0}else{s.mm=h.precipitation[k]||0;s.p=h.precipitation_probability[k]||0;s.code=h.weather_code[k]||0;s.gust=h.wind_gusts_10m[k]||0}
      wxLevel(s)});
  }catch(e){wxOK=false}
  // น้ำท่วมใกล้เส้นทาง (ระดับจังหวัด รัศมี 35 กม.)
  const step=Math.max(1,Math.floor(path.length/300)),fl=[];
  floods.forEach(f=>{let md=1e12;for(let i=0;i<path.length;i+=step){const d=hav(path[i],{lat:f.c[2],lng:f.c[3]});if(d<md)md=d}if(md<=35000)fl.push({f,km:md/1000})});
  // สรุป
  const mk=(lv,title,small)=>`<div class="fi l${lv}"><div style="flex:1"><b>${title}</b><small>${small}</small></div><span class="badge">${t("l"+lv)}</span></div>`;
  let h=RT.routes.map((x,i)=>`<button class="alt${i===RT.sel?" on":""}" data-i="${i}">${t("altN")} ${i+1}${x.name?" · "+t("viaT")+" "+esc(x.name):""} · ${(x.dist/1000).toFixed(0)} ${t("km")} · ${fmt(x.durT||x.dur)}</button>`).join("");
  h+=`<div class="sum">📏 ${t("rSum")} <b>${(r.dist/1000).toFixed(1)} ${t("km")}</b> · ⏱ <b>${fmt(secs)}</b> · ${t("rEta")} <b>${hhmm(new Date(now+secs*1000))}</b></div>`;
  h+=`<h3>🚦 ${t("tr")}</h3>`;
  if(r.durT!=null&&RT.mode==="DRIVING"){
    const ratio=r.durT/r.dur,lv=ratio>=1.6?3:ratio>=1.3?2:ratio>=1.1?1:0,lab=[t("trFree"),t("trSlow"),t("trJam"),t("trHeavy")][lv],dm=Math.round((r.durT-r.dur)/60);
    h+=lv?mk(lv,lab,`${t("trNormal")} ${fmt(r.dur)} → ${t("trNow")} ${fmt(r.durT)} (+${dm} ${t("min")})`):`<p class="note">✅ ${lab} · ${t("trNormal")} ${fmt(r.dur)} → ${t("trNow")} ${fmt(r.durT)}</p>`;
  }else h+=`<p class="note">${t("trNA")}</p>`;
  h+=`<h3>⛈ ${t("wH")}</h3>`;
  const bad=S.filter(s=>s.lv>0);
  if(!wxOK)h+=`<p class="note">${t("fail")}</p>`;
  else if(!bad.length)h+=`<p class="note">✅ ${t("wNone")}</p>`;
  else h+=bad.slice(0,10).map(s=>mk(s.lv,`${hhmm(s.eta)} · ${t("at")} ${esc(nm(nearProv(s)))} (${s.km.toFixed(0)} ${t("km")})`,s.tx.join(" · "))).join("");
  h+=`<h3>🌊 ${t("fH")}</h3>`;
  h+=fl.length?fl.sort((a,b)=>b.f.lv-a.f.lv).map(x=>mk(x.f.lv,esc(nm(x.f.c)),`${t("rise")} ≈ ${x.f.ratio.toFixed(1)}× · ${t("near")} ${x.km.toFixed(0)} ${t("km")}`)).join(""):`<p class="note">✅ ${t("fNone")}</p>`;
  h+=`<h3>🚧 ${t("aH")}</h3><p class="note">${t("aNote")}</p>`;
  h+=`<a class="note" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&origin=${RT.o.ll.lat},${RT.o.ll.lng}&destination=${RT.d.ll.lat},${RT.d.ll.lng}&travelmode=${RT.mode.toLowerCase()}">${t("aOpen")}</a>`;
  out.innerHTML=h;
  out.querySelectorAll(".alt").forEach(b=>b.onclick=()=>{RT.sel=+b.dataset.i;showRoute(false)});
  // หมุดจุดเสี่ยงบนแผนที่
  bad.forEach(s=>{const m=new google.maps.Marker({position:s,map,zIndex:15,icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillColor:LV[s.lv],fillOpacity:.9,strokeColor:"#fff",strokeWeight:2}});
    m.addListener("click",()=>{iw.setContent(`<div style="color:#14212b"><b>${hhmm(s.eta)} · ${esc(nm(nearProv(s)))}</b><br>${s.tx.map(esc).join("<br>")}</div>`);iw.open({map,anchor:m})});RT.marks.push(m)});
}
async function showRoute(first){
  RT.lines.forEach(l=>l.setMap(null));RT.marks.forEach(m=>m.setMap(null));RT.lines=[];RT.marks=[];
  const rs=RT.routes,r=rs[RT.sel],bounds=new google.maps.LatLngBounds();
  rs.forEach((x,i)=>{if(i===RT.sel)return;const pl=new google.maps.Polyline({path:x.path,map,strokeColor:"#8a97a3",strokeWeight:5,zIndex:1});pl.addListener("click",()=>{RT.sel=i;showRoute(false)});RT.lines.push(pl)});
  RT.lines.push(new google.maps.Polyline({path:r.path,map,strokeColor:"#ffffff",strokeWeight:9,zIndex:2,clickable:false}));
  RT.lines.push(new google.maps.Polyline({path:r.path,map,strokeColor:"#1a73e8",strokeWeight:6,zIndex:3,clickable:false}));
  RT.marks.push(new google.maps.Marker({position:RT.o.ll,map,label:"A",zIndex:20}),new google.maps.Marker({position:RT.d.ll,map,label:"B",zIndex:20}));
  if(first){r.path.forEach(p=>bounds.extend(p));map.fitBounds(bounds,50)}
  await analyze(r);
}
async function goRoute(){
  const out=$("rOut");out.innerHTML=`<p class="note">${t("checking")}</p>`;
  try{
    const toS=$("rTo").value.trim();if(!toS)throw new Error(t("rNeedTo"));
    const fromS=$("rFrom").value.trim();
    const [o,d]=await Promise.all([fromS?resolveLoc(fromS):here(),resolveLoc(toS)]);
    if(!inTH(o.ll.lat,o.ll.lng)||!inTH(d.ll.lat,d.ll.lng))throw new Error(t("rOut"));
    RT.o=o;RT.d=d;RT.mode=$("rMode").value;
    RT.routes=await getRoutes(o.ll,d.ll,RT.mode);
    if(!RT.routes.length)throw new Error(t("rFail"));
    RT.sel=0;await showRoute(true);
    if(RT.mode==="DRIVING"&&!$("l-traffic").checked){$("l-traffic").checked=true;traffic.setMap(map)}
  }catch(e){out.innerHTML=`<p class="note" style="color:#b3141f">${esc(e.message||e)}</p>`}
}
$("rGo").onclick=goRoute;
["rFrom","rTo"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")goRoute()}));
$("rClear").onclick=()=>{RT.lines.forEach(l=>l.setMap(null));RT.marks.forEach(m=>m.setMap(null));RT.lines=[];RT.marks=[];RT.routes=[];$("rOut").innerHTML="";$("rFrom").value="";$("rTo").value=""};
window.setDest=(la,lo)=>{$("rTo").value=la.toFixed(5)+", "+lo.toFixed(5);iw.close();goRoute()};

let lastRain=0,lastFlood=0;
async function refresh(){
  if(document.hidden)return;
  const n=Date.now(),jobs=[loadSat(),loadQuake()];
  if(n-lastRain>20*60*1000){lastRain=n;jobs.push(loadRain())}
  if(n-lastFlood>60*60*1000){lastFlood=n;jobs.push(loadFlood())}
  await Promise.all(jobs);
  $("stamp").textContent=t("upd")+" "+new Date().toLocaleTimeString(loc())+" · "+t("every");
}
refresh();setInterval(refresh,REFRESH_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
}
